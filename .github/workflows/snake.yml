name: Refresh Profile Assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/snake.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Load last-known-good assets
        uses: actions/checkout@v4
        with:
          ref: output
          path: previous-output

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render activity card
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if ! node scripts/render-activity.mjs dist; then
            echo "::warning title=Activity card refresh failed::Keeping the last-known-good SVGs."
            cp -f previous-output/activity-dark.svg previous-output/activity-light.svg dist/ 2>/dev/null || true
          fi

          for asset in dist/activity-dark.svg dist/activity-light.svg dist/github-snake.svg dist/github-snake-dark.svg; do
            if [ ! -s "$asset" ]; then
              echo "::error title=Missing profile asset::$asset has no current or last-known-good version."
              exit 1
            fi
          done

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
