name: Refresh Profile Assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Load last-known-good assets
        uses: actions/checkout@v4
        with:
          ref: output
          path: previous-output

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render languages and activity plates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          assets=(languages.svg activity.svg)

          if ! node scripts/render-activity.mjs dist; then
            echo "::warning title=Activity refresh failed::Keeping the last-known-good SVGs."
            mkdir -p dist
            for asset in "${assets[@]}"; do
              cp -f "previous-output/$asset" dist/ 2>/dev/null || true
            done
          fi

          for asset in "${assets[@]}"; do
            if [ ! -s "dist/$asset" ]; then
              echo "::error title=Missing profile asset::$asset has no current or last-known-good version."
              exit 1
            fi
          done

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
