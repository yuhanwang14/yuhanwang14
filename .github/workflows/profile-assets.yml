name: Refresh Profile Assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Check out profile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Load last-known-good assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: output
          path: previous-output

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Activity uses the public contribution calendar. Languages need PROFILE_STATS_TOKEN,
      # a token that can read private and organization repositories; without it the
      # previous languages plate is kept.
      - name: Render activity and languages plates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          assets=(activity-dark.svg activity-light.svg languages-dark.svg languages-light.svg)
          mkdir -p dist

          if ! node scripts/render-activity.mjs dist; then
            echo "::warning title=Profile refresh failed::Keeping the last-known-good SVGs."
          fi

          for asset in "${assets[@]}"; do
            if [ ! -s "dist/$asset" ]; then
              cp -f "previous-output/$asset" dist/ 2>/dev/null || true
            fi
            if [ ! -s "dist/$asset" ]; then
              echo "::error title=Missing profile asset::$asset has no current or last-known-good version."
              exit 1
            fi
          done

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
