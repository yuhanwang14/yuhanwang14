<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="96"
  viewBox="0 0 800 96"
  role="img"
  aria-labelledby="headline-title headline-description"
>
  <title id="headline-title">Computer Vision, Embodied Intelligence, Agentic Framework, and Quantitative Trading</title>
  <desc id="headline-description">Yuhan Wang's focus areas</desc>

  <style>
    .rule {
      stroke: #30363d;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .label {
      fill: #c9d1d9;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 560;
      letter-spacing: 0.2px;
    }

    .separator {
      fill: #58a6ff;
    }

    @media (prefers-color-scheme: light) {
      .rule { stroke: #d0d7de; }
      .label { fill: #57606a; }
      .separator { fill: #0969da; }
    }
  </style>

  <g aria-hidden="true">
    <line class="rule" x1="40" y1="48" x2="120" y2="48" />
    <line class="rule" x1="680" y1="48" x2="760" y2="48" />

    <text class="label" x="252" y="35" text-anchor="middle">Computer Vision</text>
    <circle class="separator" cx="400" cy="29" r="2.5" />
    <text class="label" x="548" y="35" text-anchor="middle">Embodied Intelligence</text>

    <text class="label" x="252" y="69" text-anchor="middle">Agentic Framework</text>
    <circle class="separator" cx="400" cy="63" r="2.5" />
    <text class="label" x="548" y="69" text-anchor="middle">Quantitative Trading</text>
  </g>
</svg>
